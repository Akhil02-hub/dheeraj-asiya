<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Mubarak · Ring Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #021c15;
            font-family: 'Cormorant Garamond', serif;
            color: #f6e7b4
        }

        body {
            background: radial-gradient(ellipse at 50% 42%, #0f7157 0%, #07473a 38%, #032a20 70%, #01150f 100%);
        }

        .pattern {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .9;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g fill='none' stroke='%23e3c26a' stroke-opacity='.16' stroke-width='1'><rect x='24' y='24' width='48' height='48'/><rect x='24' y='24' width='48' height='48' transform='rotate(45 48 48)'/><circle cx='48' cy='48' r='13'/><path d='M0 0 L12 12 M96 0 L84 12 M0 96 L12 84 M96 96 L84 84'/><rect x='-8' y='-8' width='16' height='16' transform='rotate(45 0 0)'/><rect x='88' y='-8' width='16' height='16' transform='rotate(45 96 0)'/><rect x='-8' y='88' width='16' height='16' transform='rotate(45 0 96)'/><rect x='88' y='88' width='16' height='16' transform='rotate(45 96 96)'/></g></svg>");
            -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 10%, #000 85%);
            mask-image: radial-gradient(ellipse at 50% 50%, transparent 10%, #000 85%);
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none
        }

        .stars i {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffe7a1;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255, 220, 130, .7);
            opacity: 0;
            animation: tw 4s infinite ease-in-out
        }

        @keyframes tw {

            0%,
            100% {
                opacity: 0;
                transform: scale(.4)
            }

            50% {
                opacity: 1;
                transform: scale(1.2)
            }
        }

        .arch {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 95vh;
            aspect-ratio: 2/3;
            max-width: 98vw;
            pointer-events: none;
            opacity: .45;
            transition: opacity 2s ease, filter 2s ease;
            filter: drop-shadow(0 0 4px rgba(227, 194, 106, .2));
        }

        body.open .arch {
            opacity: .95;
            filter: drop-shadow(0 0 10px rgba(255, 214, 120, .65))
        }

        #c {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: grab
        }

        #c:active {
            cursor: grabbing
        }

        .top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: clamp(14px, 3.2vh, 34px) 16px 0;
            pointer-events: none
        }

        .bismillah {
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: clamp(1rem, 2.8vw, 1.7rem);
            color: #f3d77e;
            text-shadow: 0 0 14px rgba(243, 215, 126, .45);
            direction: rtl;
            line-height: 1.6;
            letter-spacing: 0;
        }

        .eyebrow {
            font-family: 'Cinzel', serif;
            letter-spacing: .42em;
            font-size: clamp(.6rem, 1.5vw, .8rem);
            margin-top: clamp(6px, 1.4vh, 14px);
            color: #d9c07a;
            text-transform: uppercase;
            padding-left: .42em
        }

        h1 {
            font-weight: 300;
            font-size: clamp(2rem, 6.2vw, 4rem);
            line-height: 1.05;
            margin-top: clamp(2px, .8vh, 8px);
            background: linear-gradient(180deg, #fff3c4 0%, #e8c15f 55%, #b98a2c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .4))
        }

        h1 span {
            font-style: italic;
            font-size: .7em;
            padding: 0 .15em
        }

        .date {
            margin-top: clamp(2px, .8vh, 8px);
            font-size: clamp(.85rem, 2vw, 1.1rem);
            letter-spacing: .18em;
            color: #cdb87a;
            font-style: italic
        }

        .bottom {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px clamp(14px, 3vh, 30px);
            pointer-events: none
        }

        .blessing {
            text-align: center;
            max-width: 620px;
            min-height: clamp(60px, 12vh, 130px);
            padding: 0 8px;
            transform: translateY(16px);
            transition: opacity 1.4s ease, transform 1.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px
        }

        .blessing.show {
            opacity: 1;
            transform: none
        }

        .blessing .ar {
            font-family: 'Scheherazade New', 'Amiri', serif;
            direction: rtl;
            font-size: clamp(1rem, 3.2vw, 1.7rem);
            line-height: 1.6;
            color: #ffe9a8;
            text-shadow: 0 0 12px rgba(255, 214, 120, .5);
            padding: 0 6px;
        }

        .blessing .en {
            font-style: italic;
            font-size: clamp(.9rem, 2.2vw, 1.15rem);
            color: #d6c58f;
            line-height: 1.35
        }

        button {
            pointer-events: auto;
            margin-top: 12px;
            cursor: pointer;
            border: none;
            outline: none;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: .28em;
            text-transform: uppercase;
            font-size: clamp(.7rem, 1.8vw, .85rem);
            padding: 15px 38px 15px 42px;
            border-radius: 999px;
            color: #053a2c;
            background: linear-gradient(135deg, #fbe9a6 0%, #d9ad45 48%, #f4d77c 100%);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 240, 180, .6) inset, 0 0 26px rgba(243, 200, 90, .35);
            transition: transform .25s ease, box-shadow .25s ease;
            position: relative;
            overflow: hidden;
            animation: pulse 2.6s infinite ease-in-out;
        }

        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent);
            transform: skewX(-20deg);
            animation: shine 3.4s infinite
        }

        button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 240, 180, .8) inset, 0 0 38px rgba(255, 214, 110, .6)
        }

        button:active {
            transform: scale(.98)
        }

        button:disabled {
            opacity: .7;
            cursor: default;
            animation: none
        }

        @keyframes shine {

            0%,
            55% {
                left: -60%
            }

            100% {
                left: 130%
            }
        }

        @keyframes pulse {

            0%,
            100% {
                filter: brightness(1)
            }

            50% {
                filter: brightness(1.12)
            }
        }

        .hint {
            margin-top: 10px;
            font-size: .8rem;
            letter-spacing: .2em;
            color: rgba(214, 197, 143, .6);
            text-transform: uppercase
        }

        @media (max-height:560px) {

            .date,
            .hint {
                display: none
            }

            .blessing {
                min-height: 60px
            }
        }

        @media (max-width:600px) {
            .top {
                padding: 10px 12px 0;
            }

            .bismillah {
                font-size: 1rem;
                line-height: 1.6;
                padding: 0 6px;
            }

            .eyebrow {
                letter-spacing: .3em;
                font-size: .55rem;
                margin-top: 8px;
            }

            h1 {
                font-size: clamp(1.6rem, 7vw, 2.2rem);
                margin-top: 4px;
            }

            .arch {
                height: 92vh;
            }

            .bottom {
                padding: 0 12px 16px;
            }

            .blessing .ar {
                font-size: clamp(1rem, 3.4vw, 1.4rem);
                line-height: 1.6;
            }

            .blessing .en {
                font-size: .85rem;
                line-height: 1.35;
            }

            .hint {
                font-size: .7rem;
                letter-spacing: .15em;
                margin-top: 8px;
            }
        }

        @media (max-width:380px) {
            .bismillah {
                font-size: .9rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .eyebrow {
                letter-spacing: .25em;
                font-size: .5rem;
            }

            .blessing .ar {
                font-size: .95rem;
            }

            .blessing .en {
                font-size: .78rem;
            }

            .hint {
                font-size: .62rem;
            }
        }
    </style>
</head>

<body>
    <div class="pattern"></div>
    <div class="stars" id="stars"></div>

    <svg class="arch" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#e3c26a"
        aria-hidden="true">
        <path d="M20 592 V270 C20 150 130 80 200 12 C270 80 380 150 380 270 V592" stroke-width="2.2" />
        <path d="M38 592 V272 C38 160 138 92 200 36 C262 92 362 160 362 272 V592" stroke-width="1"
            stroke-opacity=".7" />
        <g stroke-width="1.2">
            <circle cx="200" cy="12" r="4" fill="#e3c26a" />
            <rect x="193" y="52" width="14" height="14" transform="rotate(45 200 59)" />
        </g>
    </svg>

    <canvas id="c"></canvas>

    <header class="top">
        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <p class="eyebrow">Love Mubarak</p>
        <h1>Asiya <span>&amp;</span> Dheeraj</h1>
    </header>

    <footer class="bottom">
        <div class="blessing" id="blessing">
            <div class="ar">بَارَكَ اللَّهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ</div>
            <div class="en">May Allah bless you both, bless your union, and bring you together in goodness.</div>
        </div>
        <p class="hint">Tap the box · Drag to look around</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function () {
            // ---------- twinkling DOM stars ----------
            const starsEl = document.getElementById('stars');
            for (let i = 0; i < 34; i++) {
                const s = document.createElement('i');
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = (Math.random() * 4) + 's';
                s.style.animationDuration = (3 + Math.random() * 4) + 's';
                starsEl.appendChild(s);
            }

            // ---------- helpers ----------
            const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
            const lerp = (a, b, t) => a + (b - a) * t;
            const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
            const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const easeOutBack = t => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) };
            const smooth = t => t * t * (3 - 2 * t);

            // ---------- renderer / scene ----------
            const canvas = document.getElementById('c');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            const maxAniso = renderer.capabilities.getMaxAnisotropy();

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

            // ---------- environment map (procedural) ----------
            (function () {
                const c = document.createElement('canvas'); c.width = 512; c.height = 256;
                const g = c.getContext('2d');
                const grd = g.createLinearGradient(0, 0, 0, 256);
                grd.addColorStop(0, '#fff1c9'); grd.addColorStop(.3, '#8a7447'); grd.addColorStop(.5, '#1d3a31'); grd.addColorStop(1, '#040a08');
                g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
                g.fillStyle = '#ffffff'; g.fillRect(50, 46, 90, 38); g.fillRect(270, 28, 130, 26);
                g.fillStyle = '#ffd88a'; g.fillRect(420, 70, 50, 60); g.fillRect(180, 90, 40, 30);
                g.fillStyle = '#7fe3c0'; g.fillRect(340, 100, 40, 24);
                const tex = new THREE.CanvasTexture(c);
                tex.mapping = THREE.EquirectangularReflectionMapping; tex.encoding = THREE.sRGBEncoding;
                const pm = new THREE.PMREMGenerator(renderer);
                scene.environment = pm.fromEquirectangular(tex).texture;
                tex.dispose(); pm.dispose();
            })();

            // ---------- canvas textures ----------
            function goldGrad(ctx, s) { const g = ctx.createLinearGradient(0, 0, s, s); g.addColorStop(0, '#fbeab0'); g.addColorStop(.5, '#c9a13b'); g.addColorStop(1, '#f6dc86'); return g }
            function octagram(ctx, cx, cy, r, rot) {
                for (let k = 0; k < 2; k++) { ctx.save(); ctx.translate(cx, cy); ctx.rotate((rot || 0) + k * Math.PI / 4); ctx.strokeRect(-r, -r, 2 * r, 2 * r); ctx.restore(); }
            }
            function starPath(ctx, cx, cy, ro, ri, pts, rot) {
                ctx.beginPath();
                for (let i = 0; i < pts * 2; i++) {
                    const r = i % 2 === 0 ? ro : ri, a = rot + i * Math.PI / pts;
                    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
                    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                }
                ctx.closePath();
            }
            function makeLidTexture() {
                const s = 1024, c = document.createElement('canvas'); c.width = c.height = s; const ctx = c.getContext('2d');
                const bg = ctx.createRadialGradient(s / 2, s / 2, 60, s / 2, s / 2, s * .75);
                bg.addColorStop(0, '#0f7358'); bg.addColorStop(1, '#063b2d');
                ctx.fillStyle = bg; ctx.fillRect(0, 0, s, s);
                // tiled pattern
                ctx.strokeStyle = 'rgba(235,200,105,0.22)'; ctx.lineWidth = 2;
                const step = 128;
                for (let i = 0; i < 8; i++)for (let j = 0; j < 8; j++) {
                    octagram(ctx, i * step + step / 2, j * step + step / 2, 34, 0);
                    ctx.beginPath(); ctx.arc(i * step + step / 2, j * step + step / 2, 12, 0, Math.PI * 2); ctx.stroke();
                    ctx.save(); ctx.translate(i * step, j * step); ctx.rotate(Math.PI / 4); ctx.strokeRect(-14, -14, 28, 28); ctx.restore();
                }
                // borders
                ctx.strokeStyle = goldGrad(ctx, s); ctx.lineWidth = 12; ctx.strokeRect(34, 34, s - 68, s - 68);
                ctx.lineWidth = 3; ctx.strokeRect(62, 62, s - 124, s - 124);
                // corner stars
                [[120, 120], [s - 120, 120], [120, s - 120], [s - 120, s - 120]].forEach(([x, y]) => {
                    ctx.fillStyle = '#052f24'; starPath(ctx, x, y, 52, 36, 8, Math.PI / 8); ctx.fill();
                    ctx.lineWidth = 4; ctx.stroke();
                });
                // medallion
                ctx.fillStyle = '#052f24'; ctx.beginPath(); ctx.arc(s / 2, s / 2, 340, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 9; ctx.stroke();
                ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s / 2, s / 2, 318, 0, Math.PI * 2); ctx.stroke();
                // big star
                starPath(ctx, s / 2, s / 2, 300, 232, 8, Math.PI / 8);
                ctx.fillStyle = 'rgba(235,200,105,0.10)'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
                ctx.lineWidth = 4; octagram(ctx, s / 2, s / 2, 196, 0);
                ctx.lineWidth = 2; octagram(ctx, s / 2, s / 2, 160, Math.PI / 8);
                // radial lines
                ctx.lineWidth = 2;
                for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; ctx.beginPath(); ctx.moveTo(s / 2 + Math.cos(a) * 135, s / 2 + Math.sin(a) * 135); ctx.lineTo(s / 2 + Math.cos(a) * 226, s / 2 + Math.sin(a) * 226); ctx.stroke(); }
                // inner disc
                ctx.fillStyle = '#052f24'; ctx.beginPath(); ctx.arc(s / 2, s / 2, 125, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(s / 2, s / 2, 125, 0, Math.PI * 2); ctx.stroke();
                // crescent
                ctx.fillStyle = goldGrad(ctx, s);
                ctx.beginPath(); ctx.arc(s / 2 - 16, s / 2, 82, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#052f24'; ctx.beginPath(); ctx.arc(s / 2 + 10, s / 2 - 4, 68, 0, Math.PI * 2); ctx.fill();
                // star
                ctx.fillStyle = goldGrad(ctx, s); starPath(ctx, s / 2 + 46, s / 2 - 2, 26, 11, 5, -Math.PI / 2); ctx.fill();
                const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t;
            }
            function makePlaqueTexture() {
                const s = 512, c = document.createElement('canvas'); c.width = c.height = s; const ctx = c.getContext('2d');
                ctx.strokeStyle = goldGrad(ctx, s); ctx.fillStyle = goldGrad(ctx, s);
                starPath(ctx, s / 2, s / 2, 240, 186, 8, Math.PI / 8); ctx.lineWidth = 12; ctx.stroke();
                ctx.globalAlpha = .25; ctx.fill(); ctx.globalAlpha = 1;
                ctx.lineWidth = 8; octagram(ctx, s / 2, s / 2, 150, 0);
                ctx.beginPath(); ctx.arc(s / 2, s / 2, 92, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke();
                // crescent
                ctx.beginPath(); ctx.arc(s / 2 - 8, s / 2, 58, 0, Math.PI * 2); ctx.fill();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(s / 2 + 10, s / 2 - 3, 48, 0, Math.PI * 2); ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                starPath(ctx, s / 2 + 34, s / 2 - 2, 18, 8, 5, -Math.PI / 2); ctx.fill();
                const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t;
            }
            function makeGlowTexture() {
                const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
                const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
                gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,230,160,.6)'); gr.addColorStop(1, 'rgba(255,200,90,0)');
                g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(c);
            }
            function makeFlareTexture() {
                const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
                const gr = g.createRadialGradient(128, 128, 0, 128, 128, 40);
                gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
                g.fillStyle = '#fff';
                [[1, 0], [0, 1]].forEach(([dx, dy]) => {
                    g.beginPath();
                    g.moveTo(128 - dx * 126, 128 - dy * 126); g.lineTo(128 + dy * 5, 128 + dx * 5);
                    g.lineTo(128 + dx * 126, 128 + dy * 126); g.lineTo(128 - dy * 5, 128 - dx * 5); g.closePath(); g.fill();
                });
                return new THREE.CanvasTexture(c);
            }
            const glowTex = makeGlowTexture(), flareTex = makeFlareTexture();

            // ---------- materials ----------
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xdcb24c, metalness: 1, roughness: .26, envMapIntensity: 1.6 });
            const emeraldMat = new THREE.MeshStandardMaterial({ color: 0x0b5d46, roughness: .55, metalness: .15 });
            const ivoryMat = new THREE.MeshStandardMaterial({ color: 0xf2e6c9, roughness: .92, metalness: 0, envMapIntensity: .4 });
            const lidTopMat = new THREE.MeshStandardMaterial({ map: makeLidTexture(), roughness: .5, metalness: .25 });
            const lidLinerMat = new THREE.MeshStandardMaterial({ color: 0xf2e6c9, roughness: .85, envMapIntensity: .5 });

            function box(w, h, d, mat, x, y, z, parent, shadow = true) {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; (parent || scene).add(m); return m;
            }

            // ---------- dais ----------
            const dais = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.45, .14, 72), new THREE.MeshStandardMaterial({ color: 0x053227, roughness: .4, metalness: .35 }));
            dais.position.y = -.07; dais.receiveShadow = true; scene.add(dais);
            [[2.3, .035], [1.95, .014]].forEach(([r, t]) => {
                const tor = new THREE.Mesh(new THREE.TorusGeometry(r, t, 12, 96), goldMat);
                tor.rotation.x = Math.PI / 2; tor.position.y = .002; scene.add(tor);
            });

            // ---------- ring box ----------
            const boxGroup = new THREE.Group(); scene.add(boxGroup);
            // bottom + walls
            box(2, .1, 2, emeraldMat, 0, .05, 0, boxGroup);
            box(2, 1, .1, emeraldMat, 0, .5, .95, boxGroup);
            box(2, 1, .1, emeraldMat, 0, .5, -.95, boxGroup);
            box(.1, 1, 1.8, emeraldMat, .95, .5, 0, boxGroup);
            box(.1, 1, 1.8, emeraldMat, -.95, .5, 0, boxGroup);
            // gold rim
            box(2.06, .06, .15, goldMat, 0, 1.03, .95, boxGroup);
            box(2.06, .06, .15, goldMat, 0, 1.03, -.95, boxGroup);
            box(.15, .06, 1.8, goldMat, .95, 1.03, 0, boxGroup);
            box(.15, .06, 1.8, goldMat, -.95, 1.03, 0, boxGroup);
            // gold base band
            box(2.04, .07, .13, goldMat, 0, .14, .95, boxGroup);
            box(2.04, .07, .13, goldMat, 0, .14, -.95, boxGroup);
            box(.13, .07, 1.8, goldMat, .95, .14, 0, boxGroup);
            box(.13, .07, 1.8, goldMat, -.95, .14, 0, boxGroup);
            // gold feet
            [[-.95, -.95], [.95, -.95], [-.95, .95], [.95, .95]].forEach(([x, z]) => {
                const f = new THREE.Mesh(new THREE.SphereGeometry(.09, 16, 12), goldMat); f.position.set(x * 1.03, .02, z * 1.03); boxGroup.add(f);
            });
            // cushion
            box(1.8, .4, 1.8, ivoryMat, 0, .3, 0, boxGroup);
            // plaque (front)
            const plaque = new THREE.Mesh(new THREE.PlaneGeometry(.62, .62), new THREE.MeshStandardMaterial({ map: makePlaqueTexture(), transparent: true, metalness: .7, roughness: .35 }));
            plaque.position.set(0, .58, 1.004); boxGroup.add(plaque);

            // lid (pivot at back top edge)
            const lid = new THREE.Group(); lid.position.set(0, 1.06, -1.04); boxGroup.add(lid);
            const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(2.08, .3, 2.08),
                [emeraldMat, emeraldMat, lidTopMat, lidLinerMat, emeraldMat, emeraldMat]);
            lidMesh.position.set(0, .15, 1.04); lidMesh.castShadow = true; lidMesh.receiveShadow = true; lid.add(lidMesh);
            const lidTrim = new THREE.Mesh(new THREE.BoxGeometry(2.14, .06, 2.14), goldMat);
            lidTrim.position.set(0, .03, 1.04); lidTrim.castShadow = true; lid.add(lidTrim);
            const lidTrim2 = new THREE.Mesh(new THREE.BoxGeometry(2.12, .03, 2.12), goldMat);
            lidTrim2.position.set(0, .285, 1.04); lid.add(lidTrim2);
            // clasp
            const clasp = new THREE.Mesh(new THREE.BoxGeometry(.2, .12, .06), goldMat); clasp.position.set(0, .1, 2.1); lid.add(clasp);
            // hinge
            const hinge = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .9, 16), goldMat);
            hinge.rotation.z = Math.PI / 2; hinge.position.set(0, 0, 0); lid.add(hinge);

            // ---------- rings ----------
            const rings = new THREE.Group(); rings.position.set(0, .5, 0); scene.add(rings);

            const ringA = new THREE.Group(); ringA.position.set(-.42, 0, 0); rings.add(ringA);
            const bandA = new THREE.Mesh(new THREE.TorusGeometry(.3, .05, 32, 96), goldMat); bandA.castShadow = true; ringA.add(bandA);
            const collar = new THREE.Mesh(new THREE.CylinderGeometry(.065, .045, .08, 16), goldMat); collar.position.y = .37; collar.castShadow = true; ringA.add(collar);
            const gemMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: .9, roughness: .02, flatShading: true, envMapIntensity: 3.2, emissive: 0x6f86b8, emissiveIntensity: .15, side: THREE.DoubleSide });
            const gem = new THREE.Mesh(new THREE.LatheGeometry([
                new THREE.Vector2(.0001, -.085), new THREE.Vector2(.105, 0), new THREE.Vector2(.08, .045), new THREE.Vector2(.0001, .045)
            ], 8), gemMat);
            gem.position.y = .445; ringA.add(gem);
            for (let k = 0; k < 4; k++) {
                const a = Math.PI / 4 + k * Math.PI / 2;
                const pr = new THREE.Mesh(new THREE.SphereGeometry(.016, 10, 8), goldMat);
                pr.position.set(Math.cos(a) * .098, .445, Math.sin(a) * .098); ringA.add(pr);
            }
            const flare = new THREE.Sprite(new THREE.SpriteMaterial({ map: flareTex, color: 0xfff2c8, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
            flare.position.set(0, .47, .05); flare.scale.set(.1, .1, .1); ringA.add(flare);

            const ringB = new THREE.Group(); ringB.position.set(.42, 0, 0); rings.add(ringB);
            const champagne = new THREE.MeshStandardMaterial({ color: 0xeed9a2, metalness: 1, roughness: .22, envMapIntensity: 1.6 });
            const bandB = new THREE.Mesh(new THREE.TorusGeometry(.34, .06, 32, 96), champagne); bandB.castShadow = true; ringB.add(bandB);
            // two thin gold edge-lines on the champagne band (offset so they no longer z-fight)
            [-.04, .04].forEach(z => {
                const g2 = new THREE.Mesh(new THREE.TorusGeometry(.34, .018, 10, 96), goldMat);
                g2.position.z = z; ringB.add(g2);
            });

            const ringGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0, color: 0xffd88a }));
            ringGlow.scale.set(2.6, 2.6, 1); rings.add(ringGlow);

            // ---------- lights ----------
            scene.add(new THREE.HemisphereLight(0xcfeee0, 0x0a2a20, .35));
            const key = new THREE.DirectionalLight(0xfff0d0, 1.0);
            key.position.set(3.5, 6, 4.5); key.castShadow = true;
            key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0006;
            Object.assign(key.shadow.camera, { left: -3.5, right: 3.5, top: 4, bottom: -3, near: 1, far: 20 });
            key.shadow.camera.updateProjectionMatrix();   // FIX: apply the new frustum
            scene.add(key);
            const rim = new THREE.DirectionalLight(0x6fe3bd, .7); rim.position.set(-4, 3, -4); scene.add(rim);
            const inner = new THREE.PointLight(0xffd27a, 0, 7, 2); inner.position.set(0, 1.3, .4); scene.add(inner);

            // light beam
            const beamMat = new THREE.ShaderMaterial({
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
                uniforms: { uOp: { value: 0 }, uColor: { value: new THREE.Color(0xffd98a) } },
                vertexShader: 'varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}',
                fragmentShader: 'uniform float uOp;uniform vec3 uColor;varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){float f=abs(dot(normalize(vN),normalize(vV)));float a=pow(f,1.7)*pow(1.-vUv.y,1.5)*uOp;gl_FragColor=vec4(uColor*a,a);}'
            });
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.7, .8, 5, 48, 1, true), beamMat);
            beam.position.y = 1.0 + 2.5; beam.renderOrder = 5; scene.add(beam);

            // ground glow
            const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(2.9, 64), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffd27a }));
            glowDisc.rotation.x = -Math.PI / 2; glowDisc.position.y = .01; scene.add(glowDisc);

            // ---------- sparkle particles ----------
            const N = 360;
            const pPos = new Float32Array(N * 3), pCol = new Float32Array(N * 3), pVel = new Float32Array(N * 3), pLife = new Float32Array(N), pMax = new Float32Array(N).fill(1);
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
            const pMat = new THREE.PointsMaterial({ size: .16, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
            const sparkles = new THREE.Points(pGeo, pMat); sparkles.frustumCulled = false; scene.add(sparkles);

            function emit(n, ox, oy, oz, spread, speedXZ, up, life) {
                let c = 0;
                for (let i = 0; i < N && c < n; i++) {
                    if (pLife[i] <= 0) {
                        pPos[i * 3] = ox + (Math.random() - .5) * spread;
                        pPos[i * 3 + 1] = oy + (Math.random() - .5) * spread * .5;
                        pPos[i * 3 + 2] = oz + (Math.random() - .5) * spread;
                        const a = Math.random() * Math.PI * 2, s = Math.random();
                        pVel[i * 3] = Math.cos(a) * s * speedXZ;
                        pVel[i * 3 + 1] = up * (.3 + Math.random());
                        pVel[i * 3 + 2] = Math.sin(a) * s * speedXZ;
                        pMax[i] = pLife[i] = life * (.6 + Math.random() * .8);
                        c++;
                    }
                }
            }

            // floating dust
            const D = 90, dPos = new Float32Array(D * 3), dSpd = new Float32Array(D);
            for (let i = 0; i < D; i++) { dPos[i * 3] = (Math.random() - .5) * 10; dPos[i * 3 + 1] = Math.random() * 5; dPos[i * 3 + 2] = (Math.random() - .5) * 6; dSpd[i] = .05 + Math.random() * .12; }
            const dGeo = new THREE.BufferGeometry(); dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
            const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({ size: .07, map: glowTex, color: 0xe9c87a, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
            dust.frustumCulled = false; scene.add(dust);

            // ---------- camera orbit ----------
            let userTheta = 0, userPhi = 0, targetTheta = 0, targetPhi = 0, dragging = false, lastX = 0, lastY = 0;
            canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId) });
            canvas.addEventListener('pointermove', e => {
                if (!dragging) return;
                targetTheta = clamp(targetTheta - (e.clientX - lastX) * .006, -1.5, 1.5);
                targetPhi = clamp(targetPhi + (e.clientY - lastY) * .003, -.25, .3);
                lastX = e.clientX; lastY = e.clientY;
            });
            const endDrag = () => { dragging = false };
            canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize); resize();

            // ---------- UI ----------
            const blessing = document.getElementById('blessing');
            let p = 0, dir = 0, label = ''; const DURATION = 5.2;

            // click on the box to open it
            const raycaster = new THREE.Raycaster();
            const ndc = new THREE.Vector2();
            let downX = 0, downY = 0, dragDist = 0;
            canvas.addEventListener('pointerdown', e => {
                downX = e.clientX; downY = e.clientY; dragDist = 0;
            });
            canvas.addEventListener('pointermove', e => {
                dragDist = Math.max(dragDist, Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY));
            });
            canvas.addEventListener('pointerup', e => {
                // ignore if user dragged (looking around) or box already opening/open
                if (dragDist >= 8 || dir !== 0 || p !== 0) return;
                const r = canvas.getBoundingClientRect();
                ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(ndc, camera);
                if (raycaster.intersectObject(boxGroup, true).length > 0) dir = 1;
            });

            // Auto-open the box after 1.4s so it works even without a tap
            setTimeout(() => { if (dir === 0 && p === 0) dir = 1; }, 1400);

            // ---------- loop ----------
            let time = 0, last = performance.now(), spinA = 0, spinB = 0, burstDone = false, emitAcc = 0;
            const tmpTarget = new THREE.Vector3();
            const tanHalf = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

            function frame(now) {
                requestAnimationFrame(frame);
                const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;

                // progress
                if (dir !== 0) {
                    p = clamp(p + dir * dt / DURATION, 0, 1);
                    if (p >= 1) { p = 1; dir = 0; }
                    else if (p <= 0) { p = 0; dir = 0; }
                }

                blessing.classList.toggle('show', p > .86);
                document.body.classList.toggle('open', p > .25);

                // staged progress
                const lidP = easeOutBack(seg(p, .04, .42));
                const lightP = smooth(seg(p, .22, .7));
                const ringP = easeInOut(seg(p, .4, .92));
                const camP = smooth(p);

                lid.rotation.x = -2.0 * lidP;

                rings.position.y = .5 + ringP * 1.8 + Math.sin(time * 1.6) * .05 * ringP;
                rings.scale.setScalar(1 + ringP * .18);
                rings.rotation.y = Math.sin(time * .6) * .35 * ringP;
                spinA += dt * (.4 + ringP * 1.1) * ringP; spinB += dt * (.35 + ringP * .9) * ringP;
                ringA.rotation.y = spinA; ringB.rotation.y = -spinB * .9 + .2;
                ringA.rotation.z = Math.sin(time * 1.1) * .06 * ringP; ringB.rotation.z = Math.cos(time * 1.2) * .06 * ringP;

                // light effects
                beamMat.uniforms.uOp.value = lightP * .5;
                inner.intensity = lightP * (2.6 + Math.sin(time * 3) * .25);
                inner.position.y = 1.2 + ringP * 1.4;
                glowDisc.material.opacity = lightP * .55;
                ringGlow.material.opacity = ringP * .45 * (.85 + .15 * Math.sin(time * 2.4));
                flare.material.opacity = ringP * (.55 + .45 * Math.max(0, Math.sin(time * 2.2)));
                const fs = .28 + .18 * Math.max(0, Math.sin(time * 2.2));
                flare.scale.set(fs * (1 + ringP), fs * (1 + ringP), 1); flare.material.rotation = time * .4;
                gemMat.emissiveIntensity = .15 + .25 * Math.max(0, Math.sin(time * 2.2 + .5)) * ringP;

                // sparkles
                if (dir === 1 && !burstDone && p > .42) { burstDone = true; emit(150, 0, 1.1, 0, .9, 1.8, 2.6, 2.6); }
                if (p < .3) burstDone = false;
                if (ringP > .25) {
                    emitAcc += dt * 38 * ringP;
                    const n = Math.floor(emitAcc); emitAcc -= n;
                    if (n > 0) emit(n, 0, rings.position.y, 0, 1.3, .25, .25, 2.2);
                }
                for (let i = 0; i < N; i++) {
                    if (pLife[i] > 0) {
                        pLife[i] -= dt;
                        pVel[i * 3 + 1] -= .5 * dt;
                        pVel[i * 3] *= .992; pVel[i * 3 + 2] *= .992;
                        pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
                        const t = Math.max(0, pLife[i] / pMax[i]);
                        const fade = Math.min(1, (1 - t) * 10) * Math.pow(t, .7);
                        const tw = .55 + .45 * Math.sin(time * 18 + i * 1.7);
                        const v = fade * tw;
                        pCol[i * 3] = 1 * v; pCol[i * 3 + 1] = .84 * v; pCol[i * 3 + 2] = .5 * v;
                    } else { pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; }
                }
                pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;

                // dust
                for (let i = 0; i < D; i++) {
                    dPos[i * 3 + 1] += dSpd[i] * dt; dPos[i * 3] += Math.sin(time * .4 + i) * .002;
                    if (dPos[i * 3 + 1] > 5) dPos[i * 3 + 1] = 0;
                }
                dGeo.attributes.position.needsUpdate = true;

                // camera
                const t = tanHalf(), asp = camera.aspect;
                const H = lerp(1.9, 2.35, camP), W = 1.7;
                const radius = Math.max(H / t, W / (t * asp)) * 1.25;
                const phi = THREE.MathUtils.degToRad(lerp(38, 22, camP)) + userPhi;
                if (!dragging) { targetTheta *= .985; targetPhi *= .985; }
                userTheta += (targetTheta - userTheta) * .08; userPhi += (targetPhi - userPhi) * .08;
                const theta = userTheta + Math.sin(time * .3) * .1;
                tmpTarget.set(0, lerp(.85, 1.4, camP), 0);
                camera.position.set(
                    tmpTarget.x + radius * Math.cos(phi) * Math.sin(theta),
                    tmpTarget.y + radius * Math.sin(phi),
                    tmpTarget.z + radius * Math.cos(phi) * Math.cos(theta)
                );
                camera.lookAt(tmpTarget);

                renderer.render(scene, camera);
            }
            requestAnimationFrame(frame);
        })();
    </script>
</body>
